{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业员工管理系统 - 登录</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1/css/bootstrap.min.css' %}">
    <style>
        /* 登录页单独一个整屏布局，不用 layout.html 的导航栏 */
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 420px;
            padding: 40px 44px 32px;
            background-color: #fff;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .15);
        }

        .login-box h3 {
            margin: 0 0 28px;
            color: #555;
            text-align: center;
        }

        .login-box .btn-primary {
            width: 100%;
        }

        /* 验证码图片：和输入框一样高，鼠标移上去变成小手，提示可以点击刷新 */
        .login-box .image-code {
            height: 34px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
{# name 决定服务器 request.POST 的键，id 用于前端定位。csrf_token 防跨站提交；验证码真正的有效期/一次性比较在 account.py。 #}
<div class="login-box">
    <h3>企业员工管理系统</h3>

    <form method="post" novalidate>
        {% csrf_token %}

        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" class="form-control" id="username" name="username"
                   placeholder="用户名" autocomplete="username" autofocus
                   value="{{ username|default:'' }}">
        </div>

        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="密码" autocomplete="current-password">
        </div>

        <div class="form-group">
            <label for="code">图片验证码</label>
            <div class="row">
                <div class="col-xs-7">
                    <input type="text" class="form-control" id="code" name="code"
                           placeholder="验证码" autocomplete="off">
                </div>
                <div class="col-xs-5">
                    <img class="image-code" id="image_code" src="/image/code/"
                         alt="验证码" title="点击刷新验证码">
                </div>
            </div>
        </div>

        {% if error %}
            <p style="color: red;">{{ error }}</p>
        {% endif %}

        <button type="submit" class="btn btn-primary">登录</button>
    </form>
</div>

<script>
    // 点击验证码图片重新加载一张（加时间戳，避免浏览器用缓存里的旧图）
    document.getElementById('image_code').onclick = function () {
        this.src = '/image/code/?t=' + Date.now();
    };
</script>
</body>
</html>
